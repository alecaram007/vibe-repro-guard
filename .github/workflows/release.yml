name: Release

on:
  push:
    tags:
      - "v*"

# PyPI publish uses Trusted Publishing (OIDC). One-time setup required on
# https://pypi.org/manage/account/publishing/ — see CONTRIBUTING.md for the
# environment name "pypi" expected below.

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Read package version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF##refs/tags/}"
          PKG="v${{ steps.version.outputs.value }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package version $PKG" >&2
            exit 1
          fi
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish_pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract changelog notes for this version
        id: changelog
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          NOTES=$(awk -v ver="## $VERSION" '
            $0 ~ ver {flag=1; next}
            flag && /^## / {flag=0}
            flag {print}
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release v$VERSION"
          fi
          {
            echo "notes<<__EOF__"
            echo "$NOTES"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: false
          fail_on_unmatched_files: true
