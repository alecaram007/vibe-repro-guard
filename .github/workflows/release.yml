name: Release

on:
  push:
    tags:
      - "v*"

# Distribution is intentionally git-only — no PyPI publishing.
# Users install with:
#   pip install git+https://github.com/alecaram007/vibe-repro-guard.git
# or by cloning the repo and running `./reproguard.sh`.

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Read package version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF##refs/tags/}"
          PKG="v${{ steps.version.outputs.value }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package version $PKG" >&2
            exit 1
          fi
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  github_release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract changelog notes for this version
        id: changelog
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          NOTES=$(awk -v ver="## $VERSION" '
            $0 ~ ver {flag=1; next}
            flag && /^## / {flag=0}
            flag {print}
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release v$VERSION"
          fi
          {
            echo "notes<<__EOF__"
            echo "$NOTES"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: false
          fail_on_unmatched_files: true
