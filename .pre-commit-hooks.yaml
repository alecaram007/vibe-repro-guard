# pre-commit hook manifest. Works with both flows:
#   1. `pip install git+https://github.com/alecaram007/vibe-repro-guard.git`
#      -> the `reproguard` entry point is on PATH.
#   2. pre-commit clones this repo automatically and runs python3 reproguard.py
#      directly. Both produce the same behaviour.

- id: reproguard
  name: reproguard
  description: Deterministic replay guardrail for AI-generated code
  entry: python3 reproguard.py
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-push]

- id: reproguard-init
  name: reproguard init (one-time setup)
  description: Generate reproguard.yaml on first run
  entry: python3 reproguard.py init
  language: python
  pass_filenames: false
  always_run: false
  stages: [manual]
